<!DOCTYPE html>

<html>

<head>
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <!-- 🔷 NAVBAR -->
    <div class="admin-navbar">
        <h2>Admin Dashboard</h2>
        <div class="admin-nav-links">
            <a href="/">Home</a>
            <a href="/users">Users</a>
            <a href="/settings">Settings</a>
            <a href="/logout">Logout</a>
        </div>
    </div>

    <div class="admin-container">

        <!-- 📦 PENDING CLAIMS -->
        <div class="admin-card">
            <h3>Pending Claims</h3>
            {% for claim in claims %}
            <div class="admin-claim-box">
                <p><b>Message:</b> {{ claim.message }}</p>
                <div class="admin-actions">
                    <a href="/approve/{{ claim.id }}" class="admin-approve">Approve</a>
                    <a href="/reject/{{ claim.id }}" class="admin-reject">Reject</a>
                </div>
            </div>
            {% endfor %}

        </div>

        <!-- 👥 MANAGE USERS -->
        <div class="admin-card">
            <h3>Manage Users</h3>
            <a href="/users" class="admin-btn">Manage Users</a>
        </div>

        <!-- 🎁 REWARD SETTINGS -->
        <div class="admin-card">
            <h3>Reward Settings</h3>
            <a href="/settings" class="admin-btn">Integrations</a>
        </div>
    </div>
</body>
</html>
